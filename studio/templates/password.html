{% extends "base.html" %}
{% block title %}Passwort{% endblock %}
{% block body %}
  <p class="kicker">Zugang</p>
  <h1>Passwort</h1>
  <p class="lead">Gilt nur für dieses Atelier auf dem Laptop. Mindestens 10 Zeichen.</p>
  <form method="post" class="stack narrow">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Bisheriges Passwort
      <input type="password" name="current" autocomplete="current-password" required>
    </label>
    <label>Neues Passwort
      <input type="password" name="new" autocomplete="new-password" minlength="10" required>
    </label>
    <label>Neues Passwort wiederholen
      <input type="password" name="again" autocomplete="new-password" minlength="10" required>
    </label>
    <button type="submit">Passwort ändern</button>
  </form>
{% endblock %}
