<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danke — wtho.art</title>
  <meta name="description" content="Vielen Dank für Ihre Newsletter-Anmeldung bei wtho.art — Thorsten Weitz." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f3ee;
      --fg: #161412;
      --muted: #5c574f;
      --subtle: #8a847a;
      --accent: #161412;
      --accent-fg: #ffffff;
      --border: #e4dfd6;
      --rupture: #b54432;
      --sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      --display: "Cormorant Garamond", ui-serif, Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 34rem; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
    .tick { display: inline-block; width: 2px; height: 2rem; background: var(--rupture); margin-bottom: 1.5rem; }
    h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2.25rem, 6vw, 3.25rem); margin: 0; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 1.5rem 0 0; }
    .quote { font-family: var(--display); font-style: italic; font-size: 1.375rem; color: var(--fg); margin-top: 2rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; height: 3rem; padding: 0 1.75rem;
      margin-top: 2.5rem; background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent);
      font-size: .875rem; letter-spacing: .04em; text-decoration: none;
    }
    .brand { margin-top: 3rem; font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: var(--subtle); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tick"></span>
    <h1>Vielen Dank!</h1>
    <p class="quote">Alles beginnt mit einem Gefühl.</p>
    <a class="btn" href="/">Zurück zur Startseite</a>
    <p class="brand">wtho.art — Thorsten Weitz</p>
  </div>
</body>
</html>
